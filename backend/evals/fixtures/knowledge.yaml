# معلومات عامة لوكالة التقييم (سياسات تجريبية وليست سياسات وكالة حقيقية)
- title: سياسة الإلغاء والاسترجاع
  source_type: policy
  content: |
    الإلغاء قبل موعد السفر بأكثر من 30 يوم: يُسترجع كامل المبلغ ما عدا 500 دينار رسوم إدارية.

    الإلغاء بين 30 يوم و7 أيام قبل السفر: يُسترجع 50% من المبلغ المدفوع.

    الإلغاء قبل أقل من 7 أيام أو بعد إصدار التأشيرة والتذاكر: لا يُسترجع المبلغ.

    في حالة رفض التأشيرة من الجهات المختصة: يُسترجع المبلغ كاملاً ما عدا رسوم التأشيرة.

- title: طرق الدفع
  source_type: policy
  content: |
    الدفع كاش في مكتب الوكالة، أو تحويل مصرفي على حساب الوكالة، أو عن طريق خدمة سداد.
    يُدفع عربون عند التسجيل حسب البرنامج، والباقي قبل السفر بأسبوعين.
    لا نستلم أي مدفوعات عن طريق المحادثة، والإيصال يُسلَّم في المكتب.

- title: المستندات المطلوبة للعمرة
  source_type: document
  content: |
    جواز سفر ساري لمدة 6 شهور على الأقل من تاريخ السفر.
    صورتين شخصيتين حديثتين بخلفية بيضاء.
    صورة من الرقم الوطني.
    للأطفال: شهادة ميلاد.
    أي اشتراطات إضافية تُطبَّق حسب تعليمات الجهات الرسمية وقت التقديم.
    المستندات تُسلَّم في المكتب ولا تُرسل عبر الواتساب.

- title: عنوان المكتب وأوقات الدوام
  source_type: faq
  content: |
    المكتب في طرابلس، شارع عمر المختار، قرب جامع مولاي محمد (عنوان تجريبي).
    الدوام من السبت للخميس، من 9 الصبح لين 5 العشية. الجمعة عطلة.

- title: التطعيمات
  source_type: faq
  content: |
    يُطلب تطعيم الحمى الشوكية (المننجايتس) قبل السفر حسب تعليمات الجهات الصحية وقت السفر.
    الوكالة تبلّغ الزبون بأي تحديث في الاشتراطات الصحية قبل الموعد.
